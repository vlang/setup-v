# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process
# from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
name: Check dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7

      - name: Setup Node
        id: setup_node
        if: ${{ !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.setup_node.outcome == 'success' }}
        run: npm ci

      - name: Rebuild the index.js file
        id: rebuild_the_index_js_file
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: npm run build

      - name: Compare the expected and actual dist/ directories
        if: ${{ !cancelled() && steps.rebuild_the_index_js_file.outcome == 'success' }}
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
      # If dist/ was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
